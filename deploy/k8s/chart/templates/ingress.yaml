{{- if .Values.ingress.enabled }}
{{- $fn := include "og.fullname" . -}}
# Basic auth is enforced by the gateway sidecar (deploy/apache/opengrid.conf), so this Ingress needs no
# controller-specific annotations and works with any IngressClass.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}
  labels:
    {{- include "og.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $path := list "/og/" "/ogsim/" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fn }}-api
                port:
                  name: gateway
          {{- end }}
{{- end }}
