# /etc/apache2/conf-available/opengrid.conf  (enable with: a2enconf opengrid)
#
# Reverse proxy + basic auth for the OpenGrid orchestrator (/og/) and the integration-sims
# control plane (/ogsim/). This is a conf-enabled fragment, not a vhost: Apache merges
# <Location> blocks defined in the main server config into every virtual host, so this
# single file applies to https://base.tocy-net.net/ (sites-enabled/base-ssl.conf) without
# editing that vhost file. Owned by the 'deploy' role (BUILD.md); never touch vhost files.
#
# Requires modules: proxy, proxy_http, headers, auth_basic (auth_basic already enabled on
# this host; proxy_http is enabled by the install script if missing).

# ---- /og/ : orchestrator UI/API (og-api, loopback :8080) ----
<Location /og/>
    # Strip any client-supplied identity header before re-asserting our own, authenticated one.
    RequestHeader unset X-Remote-User

    AuthType Basic
    AuthName "OpenGrid Orchestrator"
    AuthUserFile /etc/opengrid/htpasswd
    Require user operator viewer

    RequestHeader set X-Remote-User expr=%{REMOTE_USER}

    ProxyPreserveHost On
    ProxyPass        http://127.0.0.1:8080/og/ flushpackets=on
    ProxyPassReverse http://127.0.0.1:8080/og/

    # SSE support: disable response buffering/chunk coalescing so events flush promptly.
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 1
    SetEnv no-gzip 1
</Location>

# ---- /ogsim/ : integration-sims control plane (ogsim.control, loopback :8091) ----
<Location /ogsim/>
    RequestHeader unset X-Remote-User

    AuthType Basic
    AuthName "OpenGrid Integration Sims"
    AuthUserFile /etc/opengrid/htpasswd
    Require user tester

    RequestHeader set X-Remote-User expr=%{REMOTE_USER}

    ProxyPreserveHost On
    ProxyPass        http://127.0.0.1:8091/
    ProxyPassReverse http://127.0.0.1:8091/
</Location>
