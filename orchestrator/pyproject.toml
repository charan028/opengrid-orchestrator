[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengrid"
version = "0.1.0"
description = "OpenGrid Orchestrator (MVP-S) -- the live app: engine, guardian, safestop, settle, feeds, api."
requires-python = ">=3.13"
readme = "../README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "psycopg[binary,pool]>=3.1",
    "highspy>=1.7",
    "numpy>=1.26",
    "aiomqtt>=2.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sse-starlette>=2.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opengrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["opengrid"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# BUILD.md S5a: E,F,W,I,B,UP,SIM,N,RUF,ASYNC,S
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # assert and test literals are expected in tests
"tools/**" = ["S603", "S607"]  # dev tooling shells out intentionally

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "opengrid.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["highspy.*", "aiomqtt.*"]
ignore_missing_imports = true
