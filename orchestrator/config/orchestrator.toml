# Production configuration (02b-mvp-s-spec-platform.md S1.4). Non-secret only -- secrets are resolved
# by *_env name from /etc/opengrid/{api_keys,secrets}.env (S1.5). Loaded via OG_CONFIG; OG_DB and
# OG_MQTT_ROOT env vars override [postgres].database and [mqtt].topic_root respectively (BUILD.md S5).

[general]
env = "prod"
node_id = "basepower"
timezone_market = "America/Chicago"

[postgres]
host = "127.0.0.1"
port = 5432
database = "og"
pool_min = 2
pool_max = 8

[mqtt]
host = "127.0.0.1"
port = 1883
topic_root = "og/v1"
client_id_prefix = "og"
keepalive_s = 20

[feeds.ercot]
base_url = "https://api.ercot.com/api/public-reports"
subscription_key_env = "ERCOT_PUBLIC_API_KEY_PRIMARY"
subscription_key_secondary_env = "ERCOT_PUBLIC_API_KEY_SECONDARY"
username_env = "ERCOT_API_USER"
password_env = "ERCOT_API_PASSWORD"
budget_requests_per_min = 24
products = ["np6-905-cd", "np6-345-cd", "np4-732-cd", "np4-737-cd", "np4-188-cd", "np4-745-cd"]
# D-28 solar share: NP4-745-CD, Solar Power Production - Hourly Averaged Actual and Forecasted Values by
# Geographical Region (/np4-745-cd/spp_hrly_actual_fcast_geo, hourly). Endpoint verified against ERCOT's
# product page; per-region field names (gen<Region>/STPPF<Region>) UNCONFIRMED against a live response.
# System-wide solar (actual + STPPF forecast) is NP4-737-CD above. Set false to stop polling NP4-745-CD
# without a deploy (it shares the ERCOT breaker with price/load). Freshness: wind_solar_fresh_s.
# ON by owner decision (2026-09-26, r3.3): regional solar with Frank's weather-zone mapping (PR #42).
solar_by_region_enabled = true

# Solar share of load (opengrid.feeds.ercot_solar; rule in opengrid.core.solar_share): which ERCOT solar region(s) cover a load weather zone.
# ERCOT's solar regions and load weather zones are different partitions, so only zones listed here get a
# zonal share ("total" = system-wide always works). Keys are NP6-345-CD weather-zone series (the load side
# of the ratio); values are NP4-745-CD solar regions. Proposed by county overlap with ERCOT's "Wind and Solar
# Regions to County Mapping" (2024-05-31); rationale and caveats in
# docs/orchestrator/07-delivery/integrations/solar-region-mapping.md. PROPOSED, pending lead sign-off.
# Load zones reach these via forecast.service.DEFAULT_WEATHER_ZONES_BY_LOAD_ZONE (LZ_AEN -> southC etc.).
[feeds.ercot.solar_share_zones]
coast = ["FarEast"]                     # Houston metro: Harris, Fort Bend, Brazoria, Galveston
east = ["FarEast"]                      # Tyler, Longview, Lufkin
farWest = ["FarWest"]                   # Midland, Odessa, Permian Basin
north = ["NorthWest", "CenterWest"]     # Lubbock (NorthWest) and Wichita Falls (CenterWest)
northC = ["CenterEast"]                 # DFW, Waco (Dallas, Tarrant, Collin, Denton, McLennan)
southC = ["CenterEast", "SouthEast"]    # Austin (Travis, CenterEast) and San Antonio (Bexar, SouthEast)
southern = ["SouthEast"]                # Corpus Christi, Laredo, Rio Grande Valley
west = ["CenterWest"]                   # Abilene (Taylor), San Angelo (Tom Green)

[feeds.eia]
base_url = "https://api.eia.gov/v2"
api_key_env = "EIA_API_KEY"
respondent = "ERCO"

[feeds.nws]
base_url = "https://api.weather.gov"
user_agent = "OpenGrid-Orchestrator (ops@tocy-net.net)"
grid_point = "EWX/156,91"

[feeds.staleness]
# NP6-905-CD values are stamped at interval START and ERCOT posts after the interval ends, so a healthy
# feed routinely reads 15-30 min old; 600 s false-flagged NO_NEW_COMMITMENTS (R2, 2026-09-26, lead).
ercot_price_fresh_s = 2700
ercot_price_lgv_s = 900
# NP6-345-CD (actual system load by weather zone) polls hourly (feeds.scheduler.POLL_INTERVAL_S);
# 1800s (30 min) was tighter than that poll interval itself, so `last_value_at` would routinely read
# STALE in the back half of every hour even when ERCOT and the poll are both behaving normally (live
# incident: raised NO_NEW_COMMITMENTS on a feed a live probe confirmed was healthy -- 200 OK, correctly
# parsed, no breaker/auth errors; ERCOT itself just hadn't posted a newer hour yet at probe time,
# genuinely a ~13h gap on ERCOT's side that this threshold fix does not paper over). 7200s (2x the poll
# interval, matching ercot_price_fresh_s's ~2x-of-its-5-min-poll ratio) absorbs one missed/delayed post
# without false-flagging every routine hour, while still catching a real multi-hour gap like this one.
# R2 (2026-09-26, lead): NP6-345-CD actuals post about a day late, so 7200 s was still unmeetable and held
# NO_NEW_COMMITMENTS on. 48 h. HEALTH follow-up: load actuals should not gate new commitments at all.
ercot_load_fresh_s = 172800
wind_solar_fresh_s = 10800
nws_fresh_s = 10800
eia_fresh_s = 10800
# NP4-188-CD (DAM AS clearing prices) posts once/day (~14:00 CT) for the next delivery day; its
# last_value_at is a delivery timestamp, so it normally lags "now" by up to ~1 posting cycle between
# the current day's last hour and the next post -- 26h comfortably absorbs that (live defect: this was
# previously a hard constant no config key could see or override, and got mistaken for a 1h-scale
# staleness threshold, firing a false "stale for 77 minutes" alarm on data that was in fact healthy).
as_price_fresh_s = 93600

[contracts.activation]
# 03 S2.7 activation gate: DATA_CENTER/PIPELINE_AC contract admission stays closed (default) until the
# closed-loop controllers are confirmed live for a deployment. R-ADMIT-REJECT otherwise.
data_center = false

[contracts.intake]
# ERCOT_AS intake values offers at the latest np4-188-cd clearing price only if that price is at most this
# old (by og.feed_obs.ts). Older: no AS offers this gate, traced INTAKE_SKIPPED / R-AS-PRICE-STALE. Default
# is np4-188-cd's own window (26 h), the same as [feeds].as_price_fresh_s.
as_price_max_age_s = 93600

[contracts.tolling]
# D-29 utility tolling (opengrid.contracts.tolling): one obligation per day for the utility's window,
# America/Chicago wall clock. The window length must equal the TOLLING contract's product-rule duration
# (90 min), else nothing is reserved (logged). days_ahead = 1: today's window (if not started) + tomorrow's.
# days = "ALL" or "WEEKDAYS". Read once at og-engine startup; a malformed value stops the engine.
window_start = "16:30"
window_end = "18:00"
days_ahead = 1
days = "ALL"

[forecast]
horizon_hours = 24
resolution_min = 15
quantiles = [0.10, 0.50, 0.90]
# D-24: solar-driven intraday price shape, per load zone. price_series/load_series default to
# [fleet].zones (the 4 dispatchable zones) when unset -- listed explicitly here to also forecast the
# 4 market-only ERCOT load zones OpenGrid has no hubs in yet (no dispatch impact, market intelligence
# only). load_series is summed via [forecast].weather_zones_by_load_zone (approximate for the two
# regulated-municipal zones, LZ_AEN/LZ_CPS, and for LZ_LCRA/LZ_RAYBN below -- see forecast/service.py).
price_series = ["LZ_NORTH", "LZ_SOUTH", "LZ_HOUSTON", "LZ_WEST", "LZ_AEN", "LZ_CPS", "LZ_LCRA", "LZ_RAYBN"]
load_series = ["LZ_NORTH", "LZ_SOUTH", "LZ_HOUSTON", "LZ_WEST", "LZ_AEN", "LZ_CPS", "LZ_LCRA", "LZ_RAYBN"]

[fleet]
# NOTE: hub_count/banks/lease_ttl_s here are descriptive only -- no orchestrator code reads them
# today. `telemetry_interval_s` IS read: opengrid.fleet counts a hub "fresh" for zone telemetry
# coverage while its last report is under 2x this interval (02b S6.6). (The seeded topology's actual hub_count/bank_count/zone_blocks come from
# `integration-sims/config/fleet.yaml`, read read-only by `opengrid.fleet.seed`, its module docstring
# explains why). `zones` IS read directly, by `opengrid.forecast.service.compute_and_persist` (its
# `[forecast].price_series`/`load_series` fallback) -- keep it in sync with the zones actually seeded.
hub_count = 2000
banks = 40
zones = ["LZ_NORTH", "LZ_SOUTH", "LZ_HOUSTON", "LZ_WEST"]
# Build phase, 2026-09-26 (market-model-two-markets.md): once `zone_blocks` in
# integration-sims/config/fleet.yaml enables LZ_AEN and/or LZ_CPS, add them here too so
# forecast computes their price/load series, e.g.:
#   zones = ["LZ_NORTH", "LZ_SOUTH", "LZ_HOUSTON", "LZ_WEST", "LZ_AEN", "LZ_CPS"]
# Also add `[zone_territory]` entries in tdsp_tariffs.toml for any new regulated zone (see that file).
# Must match the simulator's hub telemetry cadence (integration-sims fleet config): 10 s from R3.
telemetry_interval_s = 10
lease_ttl_s = 30
banks_per_feeder = 5
# Production seeds from the generated simulator override (deploy/README.md "Austin (LZ_AEN) sim override"),
# never the repo yaml: bank/hub ids follow the ENABLED zone blocks in order and the seed upserts, so the
# repo yaml (a different enabled set) would re-key existing zone banks. Read by every seed caller:
# deploy.sh, `python -m opengrid.fleet.seed` and POST /og/api/admin/seed-fleet-topology. The file must
# exist before the first deploy (deploy/BOOTSTRAP.md); if it is missing, the seed fails and deploy.sh
# rolls back.
sim_config_path = "/etc/opengrid/sim/fleet.yaml"

[allocator]
cycle_interval_s = 2
dwell_s = 300
hysteresis_usd_per_mwh = 5
# K15 territory rule: regulated-zone banks never serve ERCOT products (DISPATCH, R2).
enforce_territory = true
# Battery wear cost ($/kWh throughput) for the dispatch objective (core.economics.wear_cost).
wear_usd_per_kwh = 0.03

[allocator.flow_limits]
# Transformer/feeder discharge flow limits in the allocator (mirrors guardian G-26..G-33).
enabled = true

[allocator.closed_loop]
# DATA_CENTER / PIPELINE_AC closed-loop controllers: off until customer go-live.
enabled = false

[guardian]
key_path = "/etc/opengrid/guardian_ed25519.key"
verdict_timeout_ms = 300
clock_offset_max_ms = 200
# Two-person stop RELEASE allow-list (og-api user ids); named by the owner 2026-09-26 (dev accounts).
stop_release_authorised_operators = ["og-op-a", "og-op-b"]

[guardian.flow]
# G-27 per-home transformer share for hubs with no transformer mapping yet: 25 kVA keeps G-27 from binding
# until real mappings exist (the 5 kVA default vetoes most discharge). G-28 feeder defaults stay in code
# (thermal 10 MW x 0.95 = 9.5 MW, reverse 3 MW).
unmapped_xfmr_kva_per_home = 25
# 09 S2.6 fail closed on missing topology: a feeder with no og.feeder_limit row vetoes any G-28 increase
# instead of taking the defaults above, and a bank with no feeder_id (ALR-BANK-UNMAPPED-TOPOLOGY, always raised)
# vetoes any batch that raises its net |setpoint|. false for R3 (the sim fleet has no topology rows yet); true at go-live.
fail_closed_missing_topology = false
# G-28/29/30 use the signed REAL_POWER_KW (production stores it for every bank) whenever it is GOOD and fresh;
# unsigned SCADA kVA is only the fallback. There, |kW| >= pf * kVA once hub telemetry rules out export
# (0 = strict, no assumption), and a hub with no og.hub.pv_rated_kw counts as default_pv_rated_kw of PV (H3).
scada_min_power_factor = 0.0
default_pv_rated_kw = 10

[guardian.feeder_ramp_ceiling_kw_per_min_by_feeder]
# G-06 per-feeder ramp ceilings (kW/min); every other feeder keeps the 3 MW/min default. The Austin
# substation battery set (D-29 utility toll, dev/seed/market_model_seed.sql) sits alone on its own
# feeder: 20 MW/min lets a 20 MW firm toll call reach full output within one minute.
"feeder-sub-LZ_AEN-00" = 20000

[trace]
# K11 journal: every process constructing a PgTraceBackend journals here (opengrid-writable).
journal_path = "/var/lib/opengrid/trace_journal.jsonl"
# K11 external anchors (opengrid.trace.anchoring, published by og-settle's invariants hook every
# anchor_interval_s). Must be absolute: og-* units run with ProtectSystem=strict, so the relative default
# (var/anchors under the read-only code tree) can never be written. The secondary copy lives on the
# backup tree (opengrid-owned; must be in og-settle's ReadWritePaths). The signing key is provisioned by
# live-path under /etc/opengrid; while it is absent, anchors publish unsigned (logged).
anchor_dir = "/var/lib/opengrid/anchors"
anchor_secondary_dir = "/srv/ogbackup/anchors"
anchor_key_path = "/etc/opengrid/trace_anchor_ed25519.key"

[safestop]
key_path = "/etc/opengrid/safestop_ed25519.key"
# confirm_window_s (default 30) is og-safestop's PROPOSE->CONFIRM window; og-api's safe-stop proposal uses it.
# RESERVED, currently unused: no code reads ramp_*_s; the hub simulator ramps every scope to 0 kW over its
# own stop_ramp_s (4.0 s, integration-sims fleet config).
ramp_bank_s = 30
ramp_zone_s = 60
ramp_fleet_s = 120

[ai_agent]
# The advisory operator copilot (issue #26). It is read-only and never in the control loop.
# Set daily_usd = 0 to switch the assistant off entirely without removing the deployment; the console
# then answers from its deterministic tier and says the assistant is unavailable.
#
# Keys come from the environment, never from this file:
#   ANTHROPIC_API_KEY -- Claude, the primary provider. Provisioned by ops in /etc/opengrid/ai_agent.env
#                        (og-api: EnvironmentFile=-/etc/opengrid/ai_agent.env).
#   TYPESAFE_API_KEY  -- TypeSafe System One, an opt-in screening FALLBACK. Used only when Claude is
#                        unavailable AND this key is set AND fallback_enabled = true.
# Absent keys are a normal state: the console answers from its no-model tier.
routing_model = "claude-haiku-4-5-20251001"   # screening: intent + prompt-injection risk (strict tool output)
explain_model = "claude-opus-5-5"             # plain-language explanations
fallback_provider = "typesafe"
fallback_enabled = false
fallback_model = "jev-latest"
fallback_timeout_s = 6.0
# Budgets: every model call (screening, explanation, fallback) counts against all three.
daily_tokens = 200000
daily_usd = 5.0
requests_per_minute = 20
timeout_s = 20.0

# US$ per million tokens, used to charge each call's reported usage against daily_usd. A model with no
# entry here is charged at a deliberately high rate (opengrid.ai_agent.budgets.UNPRICED).
[ai_agent.prices.claude-haiku-4-5-20251001]
input_per_mtok = 1.0
output_per_mtok = 5.0

[ai_agent.prices.claude-opus-5-5]
input_per_mtok = 4.0
output_per_mtok = 20.0

[health]
# Cycle-latency alert source (og-engine's [metrics].engine_port).
engine_metrics_url = "http://127.0.0.1:9101/metrics"
heartbeat_interval_s = 5
heartbeat_miss_threshold = 3
# Hub telemetry every 10 s (owner, R3, V-32; was 2 s): stale after 2.5 missed reports, offline after 6.
hub_stale_s = 25
hub_offline_s = 60
# ALR-SIM-OFFLINE: no hub telemetry and no SCADA reading for this long (>= 6 telemetry intervals).
sim_offline_s = 90

[retention]
"trace.selection".days = 90
"trace.commitment".days = 400
"trace.renomination".days = 400
"trace.exception".days = 400
"trace.shortfall".days = 400
"trace.command".days = 30
"trace.operator_action".days = 400
"trace.feed_change".days = 90
"trace.alert".days = 90
"telemetry".days = 14
"feed_obs".days = 30

[api]
bind_host = "127.0.0.1"
bind_port = 8080
sse_heartbeat_s = 15
csrf_allowed_hosts = ["base.tocy-net.net"]

[api.roles]
# The literal Apache accounts "operator"/"viewer" still map by name; named accounts are listed here.
operator = ["operator", "og-op-a", "og-op-b"]
viewer = ["viewer"]

[api.roles.customer]
# Apache account -> the customer_id it acts for (customer API; inert until [api.customer_api].enabled).
# ercot/dist/partner are the 0002-seeded customers; dc/pipe come from dev/seed/customer_services_seed.sql.
"og-cust-ercot" = "00000000-0000-7000-8000-000000000c02"
"og-cust-dist" = "00000000-0000-7000-8000-000000000c04"
"og-cust-partner" = "00000000-0000-7000-8000-000000000c05"
"og-cust-dc" = "00000000-0000-7000-8000-0000000000c6"
"og-cust-pipe" = "00000000-0000-7000-8000-0000000000c7"
"og-cust-pjm" = "00000000-0000-7000-8000-0000000000c8"
"og-cust-mobile" = "00000000-0000-7000-8000-0000000000c9"
"og-cust-largeld" = "00000000-0000-7000-8000-0000000000ca"

[api.roles.utility]
# D-33: Apache account -> the utility_id it acts for (og.utility.utility_id). The utility reads and calls
# only its own tolling obligations (/og/api/customer/v1/utility/, opengrid.customer_api.utility_routes).
"og-util-aen" = "AUSTIN_ENERGY"
# D-37: regulated since 2026-09-26 but with sample (SUSPENDED) contracts only -- mapped, NOT enabled below,
# and no Apache account exists for them, so nothing can authenticate or call as them.
"og-util-lcra" = "LCRA"
"og-util-rayburn" = "RAYBURN"

[api.utility_api]
# Utilities allowed to use the utility API (fail closed: absent = none). Add LCRA / RAYBURN only when a real
# contract is ACTIVE (and their Apache accounts exist).
enabled_utilities = ["AUSTIN_ENERGY"]

[api.customer_api]
# D-33 (2026-09-26, owner request): enabled for the utility customer API (Austin Energy toll calls). This
# mounts every customer route; each stays scoped to the caller's own customer_id / utility_id.
enabled = true

[dispatch.calls]
# D-33: per-principal limits on dispatch calls (every origin, opengrid.calls.rules.CallLimits), and the
# share of the call's target kW below which a started call reports RAMPING rather than DELIVERING.
max_calls_per_hour = 30
max_calls_per_day = 200
ramping_fraction = 0.9

[site_ingest]
# Customer site-meter / corridor-current ingest (og/v1/site/#, og/v1/corridor/#); off until go-live.
enabled = false

[ui]
base_path = "/og"

[metrics]
bind_host = "127.0.0.1"
# og-engine /metrics (loopback only): cycle latency, gate duration, flush lag, MQTT ingest lag.
engine_port = 9101

[assets]
# Asset-health drift sweep in og-settle (WATCH -> guardian-signed calibration, DEGRADED -> work order).
# OFF 2026-09-26 10:00: enabling it fleet-wide put 188 hubs in DEGRADED, 4 in QUARANTINED and opened 192
# work orders within 10 minutes (drift thresholds vs. the simulator's natural drift); re-enable only after tuning.
drift_enabled = false
drift_interval_s = 60.0

[pq_ingest]
# Waveform ingest (06-service-profiles-and-power-quality.md S6.4-6.5): summaries are buffered in og-engine
# and written in one batch every flush_interval_s; raw captures go to blob_store_dir.
summary_buffer_max = 20000
flush_batch_size = 500
flush_interval_s = 2.0
blob_store_dir = "/var/lib/opengrid/pq_waveform"
# og.hub_inverter_pq characterization from measured summaries (one batched pass per interval).
characterization_interval_s = 300.0

[selector.owner_charge_windows]
# D-30 owner grid-charging windows (CT, may wrap midnight), per utility_id or bank_id. The Fleet page's
# og.owner_charge_window rows (migration 0038) win over these; these win over the built-in default.
AUSTIN_ENERGY = ["22:00-06:00"]

[market_sim]
# og-feeds AS-deployment poller against the market simulator: off until the lead switches it on.
as_deployment_poll = false
base_url = "http://127.0.0.1:8090"
as_deployment_poll_interval_s = 10
as_deployment_lease_s = 60

[firmware]
# Firmware campaigns (docs/orchestrator/07-delivery/16-firmware-updates.md); defaults per firmware/config.py.
soc_margin_pct = 10.0
committed_lookahead_s = 900
second_operator_hub_threshold = 50
bank_max_concurrent_pct = 10.0
feeder_max_concurrent_pct = 10.0
max_failures = 2
max_failure_pct = 5.0

# DEMO catalogue: one target per hardware revision the simulator reports (RevA..RevD, hubs start on
# 1.0.0..1.19.0). The sha256 values are placeholders for the simulated images, not real firmware.
[[firmware.catalogue]]
version = "1.20.0"
hardware_revision = "RevA"
sha256 = "af0e6540a1fe0deac1b7e6a058e1e9d53cda9bab0a6de2f5c5f67676c84a6341"
release_note = "Demo image for the simulated fleet (RevA)"

[[firmware.catalogue]]
version = "1.20.0"
hardware_revision = "RevB"
sha256 = "8447b3a3930e3728f9f5c125bf77dffd16e11596cd46156a91941aee861f4fe7"
release_note = "Demo image for the simulated fleet (RevB)"

[[firmware.catalogue]]
version = "1.20.0"
hardware_revision = "RevC"
sha256 = "e013efa8b207d7784f06119d9d83bb334e331b0f20ec766df5c2a7e06d3cb101"
release_note = "Demo image for the simulated fleet (RevC)"

[[firmware.catalogue]]
version = "1.20.0"
hardware_revision = "RevD"
sha256 = "75fa8708ca3d9b12d4976484efecd908d79223e1e5fc62265768f5ab61176ae8"
release_note = "Demo image for the simulated fleet (RevD)"

[allocator.veto_retry]
# H1/H2 (workstation R3 review, 2026-09-26): the K4 re-solve ran under a new cycle id, so the guardian
# granted fresh G-05/G-06/G-28..30 accumulator budgets, and it overwrote other banks' allocator state.
# Off until the re-solve reuses the cycle id and touches only the vetoed bank.
enabled = false

[grid_link]
# D-34 utility grid-control link (docs/orchestrator/07-delivery/integrations/grid-link.md): a utility EMS
# sends D-29 toll calls and L2 LIMIT/BLOCK over DNP3 (IEEE 1815, mutual TLS) to og-engine. OFF by default:
# nothing listens until BOTH this switch and a utility's own `enabled` are true. Addresses, CNs and
# certificates below are placeholders (192.0.2.0/28 is a documentation range that matches no real peer);
# replace them from the utility's signed point-list agreement before enabling.
enabled = false
mqtt_username = "og_gridlink"
mqtt_password_env = "OG_MQTT_GRIDLINK_PASSWORD"

[[grid_link.utilities]]
utility_id = "AUSTIN_ENERGY"
enabled = false
listen_host = "0.0.0.0"
listen_port = 20001
allowed_peers = ["192.0.2.0/28"]
allowed_peer_cns = ["aen-ems-primary", "aen-ems-backup"]
banks = ["bank-040", "bank-041", "bank-042", "bank-043", "bank-044", "bank-045", "bank-046", "bank-047",
         "bank-048", "bank-049", "bank-sub-LZ_AEN-00"]
max_setpoint_kw = 26000   # D-29(b): Austin home block + 20 MW substation set
heartbeat_timeout_s = 30
[[grid_link.utilities.l2_targets]]
name = "LZ_AEN"
zone = "LZ_AEN"
[[grid_link.utilities.l2_targets]]
name = "SUB_LZ_AEN_00"
bank_id = "bank-sub-LZ_AEN-00"
[grid_link.utilities.tls]
enabled = true
cert_file = "/etc/opengrid/certs/og-gridlink.pem"
key_file = "/etc/opengrid/certs/og-gridlink.key"
client_ca_file = "/etc/opengrid/certs/aen-ems-ca.pem"
[grid_link.utilities.dnp3]
outstation_address = 10
master_address = 1

# D-37: LCRA and RAYBURN are regulated territory but have NO contract (banks UNAVAILABLE, sample toll
# contracts SUSPENDED). Identities and point lists only; they stay disabled until a real contract exists,
# and the core call function would refuse their calls anyway (no active tolling obligation).
[[grid_link.utilities]]
utility_id = "LCRA"
enabled = false
listen_host = "0.0.0.0"
listen_port = 20002
allowed_peers = ["192.0.2.0/28"]
allowed_peer_cns = ["lcra-ems-primary"]
banks = ["bank-050", "bank-051", "bank-052", "bank-053", "bank-054", "bank-055", "bank-056", "bank-057",
         "bank-058", "bank-059"]
max_setpoint_kw = 5000
[[grid_link.utilities.l2_targets]]
name = "LZ_LCRA"
zone = "LZ_LCRA"
[grid_link.utilities.tls]
enabled = true
