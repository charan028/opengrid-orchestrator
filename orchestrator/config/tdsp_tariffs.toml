# Residential TDU (TDSP) delivery charges, versioned and effective-dated (FR-ING-175, M1 delivery charge).
# Source: PUCT "Residential TDU Delivery Charges Per Month", as of 2026-09-01 (owner-supplied screenshot),
# cross-checked against the TDSP retail delivery tariffs the owner supplied on 2026-09-26: CenterPoint Houston
# Electric, AEP Texas (eff. 2026-08-28), Oncor, TNMP (20251229).
# Rates update about every March 1 and September 1. Add a new [[tariff]] block per change; never edit old blocks.
#
# Owner decisions 2026-09-26:
#   - Charged per kWh DRAWN FROM THE GRID (charging energy); a flat per-kWh rate.
#   - Assume the FULL delivery charge applies to battery charging energy. Behind-the-meter batteries on a shared
#     retail meter do not qualify as Wholesale Storage Load; there is no ADER exemption.
#   - Serving the home's own load avoids it; exports do not recover it.
# Wired (09 D5): the selector objective charges it on grid-drawn kWh (engine M1-by-zone lookup) and settle
# books it (`opengrid.settle.tariffs.m1_delivery_charge`).

[[tariff]]
tdsp = "ONCOR"
effective_from = "2026-09-01"
volumetric_usd_per_kwh = 0.060295
customer_charge_usd_per_month = 1.48
metering_charge_usd_per_month = 2.58
load_zones = ["LZ_NORTH", "LZ_WEST"]  # approximate: DFW (North), plus parts of West

[[tariff]]
tdsp = "CENTERPOINT"
effective_from = "2026-09-01"
volumetric_usd_per_kwh = 0.064130
customer_charge_usd_per_month = 2.11
metering_charge_usd_per_month = 2.79
load_zones = ["LZ_HOUSTON"]

[[tariff]]
tdsp = "AEP_CENTRAL"
effective_from = "2026-09-01"
volumetric_usd_per_kwh = 0.058  # PUCT summary. Reconstructed from the tariff riders: 0.057824 (see tdsp-tariffs-2026-09.md)
customer_charge_usd_per_month = 1.27
metering_charge_usd_per_month = 1.97
load_zones = ["LZ_SOUTH"]

[[tariff]]
tdsp = "AEP_NORTH"
effective_from = "2026-09-01"
volumetric_usd_per_kwh = 0.057  # PUCT summary. Reconstructed: 0.056677 (Central-only riders NDC/SRC/ADFITC excluded)
customer_charge_usd_per_month = 1.27
metering_charge_usd_per_month = 1.97
load_zones = ["LZ_WEST"]

[[tariff]]
tdsp = "TNMP"
effective_from = "2026-09-01"
volumetric_usd_per_kwh = 0.074022
customer_charge_usd_per_month = 1.13
metering_charge_usd_per_month = 6.72
load_zones = ["LZ_NORTH", "LZ_SOUTH", "LZ_WEST"]  # non-contiguous territory; needs a per-site TDSP attribute

# Default TDSP per load zone, for simulated banks that have no explicit TDSP. Real sites carry their TDSP (ESI ID).
# LZ_AEN/LZ_CPS/LZ_LCRA/LZ_RAYBN (see [zone_territory] below) are deliberately absent here: `settle.tariffs.tdsp_for_zone`
# returns `None` for a zone with no entry, and `m1_delivery_charge` prices `None` at $0 -- exactly the
# "never inside a regulated utility's own territory" rule this module's docstring already states, with
# no code change needed. Never add LZ_AEN/LZ_CPS/LZ_LCRA/LZ_RAYBN to this table (D-37: no M1 in them).
[zone_default_tdsp]
LZ_NORTH = "ONCOR"
LZ_HOUSTON = "CENTERPOINT"
LZ_SOUTH = "AEP_CENTRAL"
LZ_WEST = "AEP_NORTH"

# Regulated-utility territory per load zone (build phase, 2026-09-26: market-model-two-markets.md S3a/
# S3c -- "a regulated contract is served only by assets inside that utility's service territory"). Read
# through `opengrid.market` (`load_zone_territory` / `territory_of_zone`) by the selector (K15 bank
# eligibility, no FREE headroom from a regulated bank), the allocator (`enforce_territory`) and the
# guardian (G-33), and by the engine's M1-by-zone lookup and the charge-window API.
#
# `market`: REGULATED (vertically integrated, outside ERCOT retail choice) or FREE (ERCOT competitive
# area, already the implicit default for every zone not listed here). `delivery_charge`: "NONE" marks a
# zone whose charging cost is entirely inside the utility contract's own terms (never a separate TDSP
# line -- see `[zone_default_tdsp]`'s comment above and `settle/tariffs.py`'s module docstring), as
# opposed to "M1" for the ERCOT competitive zones above.
#
# Territory boundaries are approximate pending GIS-sourced service-territory polygons (research in
# progress: `integrations/regulated-utilities-austin-cps-2026-09.md`) -- LZ_AEN/LZ_CPS are ERCOT
# settlement-point codes standing in for "assets inside this utility's territory", not literal ERCOT
# load-zone boundaries (Austin Energy and CPS Energy are both islands within the ERCOT footprint, not
# whole load zones).
[zone_territory]
LZ_AEN = { utility = "AUSTIN_ENERGY", market = "REGULATED", delivery_charge = "NONE" }
LZ_CPS = { utility = "CPS_ENERGY", market = "REGULATED", delivery_charge = "NONE" }

# LZ_LCRA and LZ_RAYBN: REGULATED (NOIE) territory, D-37 (owner decision 2026-09-26, supersedes D-32's
# "free market"). They are modelled exactly like LZ_AEN (market = "REGULATED", their own utility id), not
# with market = "NOIE": a NOIE owner serves neither market, so it could never carry the utility's own
# (sample) toll contract, while a REGULATED owner gets K15 (no ERCOT energy/AS/headroom from its banks),
# G-33 (manual discharges vetoed unless they serve that utility's own obligation), K15(c) no net export,
# and no M1 (absent from [zone_default_tdsp], delivery_charge = "NONE").
#   - LCRA (Lower Colorado River Authority) and RAYBURN (Rayburn Country Electric Cooperative): the real
#     counterparties may be their member cities and distribution co-ops; the utility ids stand for them.
#   - NO real contract exists: their banks are og.bank.availability = UNAVAILABLE, reason
#     REGULATED_NO_CONTRACT (migration 0046), until a real contract is activated (D-37, operator guide).
# Committed ERCOT obligations already on their banks at the switch complete untouched (K13 grandfathering,
# opengrid.market.availability).
LZ_LCRA = { utility = "LCRA", market = "REGULATED", delivery_charge = "NONE" }
LZ_RAYBN = { utility = "RAYBURN", market = "REGULATED", delivery_charge = "NONE" }