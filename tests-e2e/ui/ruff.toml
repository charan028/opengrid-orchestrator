# Mirrors orchestrator/pyproject.toml [tool.ruff] (BUILD.md S5a) -- ruff discovers config per file, and
# tests-e2e/ is outside orchestrator/, so without this it would fall back to its 88-column defaults.
line-length = 110
target-version = "py313"
src = ["."]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S"]
ignore = ["E501"]

[lint.per-file-ignores]
"test_*.py" = ["S101"]
"conftest.py" = ["S101"]
