# dev/mosquitto/mosquitto.conf -- mirrors production's auth model (password file + ACL file,
# no anonymous access) on the dev stack's single listener. See deploy/README.md's "MQTT ACL"
# section for the production topology this is meant to match.

listener 1883
allow_anonymous false

password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/opengrid.acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
