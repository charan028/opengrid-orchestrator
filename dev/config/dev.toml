# dev/config/dev.toml -- WP D0 local dev stack config, for orchestrator processes run from
# your IDE or venv (host side) against `docker compose` services published on localhost.
# Mirrors orchestrator/config/test.toml's dev-friendly shape (og_test DB, sim feeds, /tmp key
# paths) but talks to the dev-stack ports and a 200-hub/8-bank fleet, and never live ERCOT/
# EIA/NWS by default (BUILD.md WP D0 item 2).
#
# Usage: `OG_CONFIG=dev/config/dev.toml python -m opengrid.api` (run from the repo root so the
# relative `dev/keys/*.key` paths below resolve).
#
# If you instead run the orchestrator processes *in* docker (the optional `orchestrator`
# compose profile), they use dev/config/docker.toml instead -- see dev/README.md -- because
# `postgres`/`mosquitto`/`sim-market` are service *names* on the compose network, not
# `127.0.0.1`.

[general]
env = "dev"
node_id = "dev-stack"
timezone_market = "America/Chicago"

[postgres]
host = "127.0.0.1"
port = 5432
database = "og"
pool_min = 1
pool_max = 4

[mqtt]
host = "127.0.0.1"
port = 1883
topic_root = "og/v1"
client_id_prefix = "og-dev"
keepalive_s = 20

[feeds.ercot]
base_url = "http://127.0.0.1:8090/ercot"
# See dev/config/docker.toml's identical setting -- points the ROPC token flow at sim-market's
# stand-in instead of the real ercotb2c.b2clogin.com.
token_url = "http://127.0.0.1:8090/token"
subscription_key_env = "ERCOT_PUBLIC_API_KEY_PRIMARY"
subscription_key_secondary_env = "ERCOT_PUBLIC_API_KEY_SECONDARY"
username_env = "ERCOT_API_USER"
password_env = "ERCOT_API_PASSWORD"
budget_requests_per_min = 24
products = ["np6-905-cd", "np6-345-cd", "np4-732-cd", "np4-737-cd", "np4-188-cd"]
# D-28 regional solar (NP4-745-CD) is polled unless switched off, whatever `products` lists. The market
# simulator has no such endpoint (404), and a product that never gets a value leaves a stale og.feed_status
# row, which sets NO_NEW_COMMITMENTS fleet-wide. Off on the sim-fed stack.
solar_by_region_enabled = false

[feeds.eia]
base_url = "http://127.0.0.1:8090/eia"
api_key_env = "EIA_API_KEY"
respondent = "ERCO"

[feeds.nws]
base_url = "http://127.0.0.1:8090/nws"
user_agent = "OpenGrid-Orchestrator-Dev (dev@localhost)"
grid_point = "EWX/156,91"

[feeds.staleness]
# Base's R2 hotfix values. Since R2 a stale feed sets NO_NEW_COMMITMENTS and the engine and selector enforce
# it, and the market simulator stamps observations like ERCOT does: prices at the 15-min interval start, load
# hourly. With 600 s / 1800 s the stack would drop into NO_NEW_COMMITMENTS for about 5 min of every 15 (price)
# and half of every hour (load). Live ERCOT posts later still (prices ~30 min, load ~1 day behind).
ercot_price_fresh_s = 2700
ercot_price_lgv_s = 900
ercot_load_fresh_s = 172800
wind_solar_fresh_s = 10800
nws_fresh_s = 10800
eia_fresh_s = 10800

[forecast]
horizon_hours = 24
resolution_min = 15
quantiles = [0.10, 0.50, 0.90]

# Must match dev/config/fleet.dev.yaml and dev/config/scada.dev.yaml (hub_count/bank_count) --
# those YAML files are what the sim containers and opengrid.fleet.seed actually read; this
# section is kept in sync for readers of this file and any future orchestrator code that reads
# [fleet] directly.
[fleet]
hub_count = 200
banks = 8
zones = ["LZ_NORTH", "LZ_SOUTH", "LZ_HOUSTON", "LZ_WEST"]
# R3: must match the simulator's hub telemetry cadence (fleet.dev.yaml: 10 s since R3). Health counts a hub
# online only while its last report is under 2x this, and a hub not online gets no discharge.
telemetry_interval_s = 10
lease_ttl_s = 30

[allocator]
cycle_interval_s = 2
dwell_s = 300
hysteresis_usd_per_mwh = 5

[guardian]
key_path = "dev/keys/guardian-dev.key"
verdict_timeout_ms = 300
clock_offset_max_ms = 200
# D-12 test operators (og-op-a/og-op-b) -- see dev/config/docker.toml's identical setting.
stop_release_authorised_operators = ["og-op-a", "og-op-b"]

[safestop]
key_path = "dev/keys/safestop-dev.key"
ramp_bank_s = 30
ramp_zone_s = 60
ramp_fleet_s = 120
# See dev/config/docker.toml's identical setting (host-relative path here).
guardian_public_key_path = "dev/keys/guardian-dev.pub"

[health]
# R3: base's value for the 10 s telemetry cadence.
sim_offline_s = 90
heartbeat_interval_s = 5
heartbeat_miss_threshold = 3
hub_stale_s = 25
hub_offline_s = 60

[retention]
"trace.selection".days = 90
"trace.commitment".days = 400
"trace.renomination".days = 400
"trace.exception".days = 400
"trace.shortfall".days = 400
"trace.command".days = 30
"trace.operator_action".days = 400
"trace.feed_change".days = 90
"trace.alert".days = 90
"telemetry".days = 14
"feed_obs".days = 30

[api]
bind_host = "127.0.0.1"
bind_port = 8080
sse_heartbeat_s = 15
csrf_allowed_hosts = ["localhost:8080", "127.0.0.1:8080"]

[api.roles]
# D-12 test operators (og-op-a/og-op-b) -- see dev/config/docker.toml's identical setting.
operator = ["operator", "og-op-a", "og-op-b"]
viewer = ["viewer"]

[ui]
base_path = "/og"

[metrics]
bind_host = "127.0.0.1"


[contracts.intake]
# R3: AS intake ignores an AS clearing price older than this (base's value).
as_price_max_age_s = 93600

[ai_agent]
# The demo stack screens every copilot question with TypeSafe's Jev first (typed intent and injection
# judgements, sub-second) and lets Claude write explanations. Keys come from the environment
# (TYPESAFE_API_KEY, ANTHROPIC_API_KEY); with neither set the copilot answers from its no-model tier.
screening_provider = "typesafe"
fallback_enabled = true
