# dev/config/scada.dev.yaml -- WP D0 dev-stack override of integration-sims/config/scada.yaml
# (owned by the `sims` role -- not edited here). bank_count 8 to match dev/config/fleet.dev.yaml
# (BUILD.md WP D0 item 1: fleet at 200 hubs / matching bank layout for laptops). Mounted into
# the `sim-scada` container at /app/dev/config/scada.dev.yaml and selected via
# OGSIM_SCADA_CONFIG.
#
# No `mqtt:` key here either -- see fleet.dev.yaml's comment; the same
# raw.get(key, env-fallback) precedence applies to ogsim.scada.

bank_count: 8
zones: [LZ_NORTH, LZ_SOUTH, LZ_HOUSTON, LZ_WEST]

publish_interval_s: 2.0
# feeder segment (~50 homes), not a single distribution transformer.
bank_kva_rating_default: 600.0
overload_consecutive_samples: 3
base_load_kw_default: 200.0

# No history file in the dev stack (that path only exists on the production server) -- this is
# not fatal, ogsim.scada.background falls back to a synthetic diurnal background load.
history_tsv_path: /var/lib/opengrid/import/mariadb_history_signals.tsv
