# dev/docker-compose.yml -- WP D0 local dev stack (BUILD.md / WORKBOARD.md).
#
# Mirrors production's topology (deploy/README.md) at laptop scale:
#   - postgres:17 with databases `og` (app data) and `og_test` (pytest), owner `opengrid`;
#   - eclipse-mosquitto:2 with the same 6-user ACL model as production's
#     /etc/mosquitto/opengrid.acl (dev/mosquitto/opengrid.acl, generated by
#     dev/scripts/gen_mosquitto_acl.py);
#   - a one-shot `migrate` service (db migrate + fleet seed);
#   - the 4 integration simulators (market, fleet at 200 hubs by default, scada, control).
#
# The orchestrator's own processes (og-feeds/og-engine/og-guardian/og-safestop/og-settle/
# og-api) are NOT started by default -- run them from your IDE or venv against these
# published ports with `OG_CONFIG=dev/config/dev.toml` (dev/README.md). The optional
# `orchestrator` profile runs them in containers instead, for anyone who'd rather not set up
# a local venv.
#
# UNTESTED ON DOCKER as of this writing -- see dev/README.md's "Status" section.

x-sims-build: &sims-build
  context: ..
  dockerfile: dev/docker/sims.Dockerfile

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opengrid}
      POSTGRES_DB: ${POSTGRES_DB:-og}
    # POSTGRES_PASSWORD comes from dev/secrets (falling back to dev/secrets.example) via
    # env_file below, NOT compose-level ${...} interpolation -- interpolation only sees the
    # process environment and dev/.env, never our separate dev/secrets file, so a
    # `POSTGRES_PASSWORD: ${OG_DB_PASSWORD:?...}` here would always resolve empty.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-og-test-db.sh:/docker-entrypoint-initdb.d/10-init-og-test-db.sh:ro
    env_file:
      - path: ./secrets
        required: false
      - path: ./secrets.example
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opengrid} -d ${POSTGRES_DB:-og}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto-init:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/scripts/gen-mosquitto-passwd.sh"]
    volumes:
      - ./scripts/gen-mosquitto-passwd.sh:/scripts/gen-mosquitto-passwd.sh:ro
      - mosquitto_secrets:/mosquitto/secrets
    env_file:
      - path: ./secrets
        required: false
      - path: ./secrets.example
        required: false
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/opengrid.acl:/mosquitto/config/opengrid.acl:ro
      - mosquitto_secrets:/mosquitto/secrets:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  migrate:
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
      OG_FLEET_SIM_CONFIG: /app/dev/config/fleet.dev.yaml
    env_file:
      - path: ./secrets
        required: false
      - path: ./secrets.example
        required: false
    volumes:
      - ..:/app:ro
    working_dir: /app
    command: ["sh", "-c", "python -m opengrid.platform.db migrate && python -m opengrid.fleet.seed"]
    restart: "no"

  sim-market:
    build: *sims-build
    restart: unless-stopped
    ports:
      - "${MARKET_SIM_PORT:-8090}:8090"
    environment:
      OGSIM_MARKET_HOST: 0.0.0.0
      OGSIM_MARKET_PORT: "8090"
      OGSIM_MARKET_DATA_MODE: ${MARKET_DATA_MODE:-synthetic}
    # market doesn't touch MQTT/interfaces/, but mounting the repo read-only here too costs
    # nothing and keeps every sim service consistent with sim-fleet/sim-scada/sim-control.
    volumes:
      - ..:/app:ro
    working_dir: /app
    command: ["python", "-m", "ogsim.market"]

  sim-fleet:
    build: *sims-build
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      OG_MQTT_HOST: mosquitto
      OG_MQTT_PORT: "1883"
      OG_MQTT_ROOT: og/v1
      OGSIM_FLEET_CONFIG: /app/dev/config/fleet.dev.yaml
    env_file:
      - path: ./secrets
        required: false
      - path: ./secrets.example
        required: false
    volumes:
      - ..:/app:ro
    working_dir: /app
    command: ["python", "-m", "ogsim.fleet"]

  sim-scada:
    build: *sims-build
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      OG_MQTT_HOST: mosquitto
      OG_MQTT_PORT: "1883"
      OG_MQTT_ROOT: og/v1
      OGSIM_SCADA_CONFIG: /app/dev/config/scada.dev.yaml
    env_file:
      - path: ./secrets
        required: false
      - path: ./secrets.example
        required: false
    volumes:
      - ..:/app:ro
    working_dir: /app
    command: ["python", "-m", "ogsim.scada"]

  sim-control:
    build: *sims-build
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      sim-market:
        condition: service_started
    ports:
      - "${CONTROL_SIM_PORT:-8091}:8091"
    environment:
      OGSIM_CONTROL_HOST: 0.0.0.0
      OG_MQTT_HOST: mosquitto
      OG_MQTT_PORT: "1883"
      OG_MQTT_ROOT: og/v1
      OGSIM_MARKET_ADMIN_URL: http://sim-market:8090
    env_file:
      - path: ./secrets
        required: false
      - path: ./secrets.example
        required: false
    volumes:
      - ..:/app:ro
    working_dir: /app
    command: ["python", "-m", "ogsim.control", "serve", "--port", "8091"]

  # --- optional profile: run the orchestrator's own processes in containers instead of your
  # IDE/venv. `docker compose --profile orchestrator up` (or `make -C dev dev-up-full`).
  og-feeds:
    profiles: ["orchestrator"]
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
    env_file: [{ path: ./secrets, required: false }, { path: ./secrets.example, required: false }]
    volumes: ["..:/app:ro"]
    working_dir: /app
    command: ["python", "-m", "opengrid.feeds.main"]

  og-engine:
    profiles: ["orchestrator"]
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
    env_file: [{ path: ./secrets, required: false }, { path: ./secrets.example, required: false }]
    volumes: ["..:/app:ro"]
    working_dir: /app
    command: ["python", "-m", "opengrid.engine.main"]

  og-guardian:
    profiles: ["orchestrator"]
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
    env_file: [{ path: ./secrets, required: false }, { path: ./secrets.example, required: false }]
    volumes: ["..:/app:ro"]
    working_dir: /app
    command: ["python", "-m", "opengrid.guardian.main"]

  og-safestop:
    profiles: ["orchestrator"]
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
    env_file: [{ path: ./secrets, required: false }, { path: ./secrets.example, required: false }]
    volumes: ["..:/app:ro"]
    working_dir: /app
    command: ["python", "-m", "opengrid.safestop.main"]

  og-settle:
    profiles: ["orchestrator"]
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
    env_file: [{ path: ./secrets, required: false }, { path: ./secrets.example, required: false }]
    volumes: ["..:/app:ro"]
    working_dir: /app
    command: ["python", "-m", "opengrid.settle.main"]

  og-api:
    profiles: ["orchestrator"]
    build:
      context: ..
      dockerfile: dev/docker/orchestrator.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      OG_CONFIG: /app/dev/config/docker.toml
    env_file: [{ path: ./secrets, required: false }, { path: ./secrets.example, required: false }]
    volumes: ["..:/app:ro"]
    working_dir: /app
    command: ["python", "-m", "opengrid.api.main"]

volumes:
  pgdata: {}
  mosquitto_secrets: {}
  mosquitto_data: {}
  mosquitto_log: {}
