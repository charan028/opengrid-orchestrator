# Mirrors orchestrator/pyproject.toml [tool.ruff] (BUILD.md S5a); tests-perf/ has no pyproject of its own.
line-length = 110
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S"]
ignore = ["E501"]

[lint.per-file-ignores]
"test_*.py" = ["S101", "S105", "S106"]
# stack control shells out to docker/systemctl/stack.sh with fixed argv (no untrusted input)
"campaign.py" = ["S603", "S607"]
"targets.py" = ["S603", "S607"]
"stress.py" = ["S603", "S607"]
"compose/seed_extra.py" = ["S603"]
