# ogsim.scada configuration (02b §4.2 bank kVA rating, §5.1 bank aggregators).
# Env overrides: OG_MQTT_HOST/OG_MQTT_PORT/OG_MQTT_ROOT/OG_MQTT_SIM_PASSWORD.
# Point OGSIM_SCADA_CONFIG at a copy of this file to override values below.

mqtt:
  host: 127.0.0.1
  port: 1883
  topic_root: og/v1

bank_count: 40
zones: [LZ_NORTH, LZ_SOUTH, LZ_HOUSTON, LZ_WEST]

# Optional extra load-zone blocks (build phase, 2026-09-26): must mirror fleet.yaml's own
# zone_blocks: entry for entry (same manual-duplication pattern bank_count/zones already use
# across the two config files) so ogsim.scada covers exactly the banks ogsim.fleet seeds.
# Disabled by default -- no behaviour change until a block is turned on in BOTH files.
zone_blocks:
  - zone: LZ_AEN
    banks: 10
    homes_per_bank: 50
    enabled: false
  - zone: LZ_CPS
    banks: 10
    homes_per_bank: 50
    enabled: false

publish_interval_s: 2.0
# feeder segment (~50 homes), not a single distribution transformer.
bank_kva_rating_default: 600.0
overload_consecutive_samples: 3
base_load_kw_default: 200.0

# Seeded from substation_load_kw in this file when present on the server;
# falls back to a synthetic diurnal background load otherwise (never fatal).
history_tsv_path: /var/lib/opengrid/import/mariadb_history_signals.tsv
