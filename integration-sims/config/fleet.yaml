# ogsim.fleet configuration (02b §4 hub/bank physics, §5 sim harness).
# Env overrides: OG_MQTT_HOST/OG_MQTT_PORT/OG_MQTT_ROOT/OG_MQTT_SIM_PASSWORD.
# Point OGSIM_FLEET_CONFIG at a copy of this file to override values below.

mqtt:
  host: 127.0.0.1
  port: 1883
  topic_root: og/v1

hub_count: 2000
bank_count: 40
zones: [LZ_NORTH, LZ_SOUTH, LZ_HOUSTON, LZ_WEST]

# OWNER DECISION, 2026-09-26 (V-32): 10 s is the spec's normal telemetry-publish cadence (cuts disk
# load on the base server) -- the fleet's PHYSICS tick (SoC step, stop ramp, lease/autonomy) stays at
# physics_tick_interval_s (2 s) regardless; see FleetConfig.physics_tick_interval_s's docstring. A
# hub whose health/fault_code changes still publishes telemetry immediately, event-driven, rather
# than waiting out the rest of this interval (ogsim.fleet.runtime.run_fleet).
telemetry_interval_s: 10.0
physics_tick_interval_s: 2.0
lease_ttl_s: 30.0
lease_hold_after_expiry_s: 5.0
stop_ramp_s: 4.0

e_kwh_default: 39.2  # Base Power home battery, usable kWh (confirmed by Base, 2026-09-25).
reserve_frac_default: 0.20
p_kw_default: 11.0  # Base Power inverter, kW per battery unit (confirmed by Base, 2026-09-25); 2-unit homes = 20 kW
eta_c: 0.9487
eta_d: 0.9487
self_discharge_kwh_per_h: 0.0005
# feeder segment (~50 homes), not a single distribution transformer.
bank_kva_rating_default: 600.0

# Dual-unit homes (confirmed by Base, 2026-09-25): a share of homes have TWO battery units instead
# of one. Dual-unit rule (must match ogsim.fleet.state / opengrid.fleet.seed exactly): hub index i
# (hub-{i:05d}) is dual-unit iff floor((i + 1) * dual_unit_share) > floor(i * dual_unit_share),
# which selects exactly floor(hub_count * dual_unit_share) hubs, deterministically and evenly
# spread across i in range(hub_count).
dual_unit_share: 0.2
e_kwh_dual_unit: 78.4  # Dual-unit home usable kWh (2 Base Power battery units).
p_kw_dual_unit: 20.0  # Dual-unit home inverter kW (confirmed by Base, 2026-09-25).

# Optional extra load-zone blocks (build phase, 2026-09-26: Austin Energy / CPS Energy regulated
# municipal utilities -- see docs/orchestrator/07-delivery/08-market-model-two-markets.md). Disabled
# by default: an `enabled: false` block reserves NO hub/bank ids, so the base 2,000-hub/40-bank fleet
# above is byte-for-byte unchanged whether or not this list is present. Enabling a block starts its
# ids at hub-02000/bank-040 (or after the previous enabled block, in list order) and never renumbers
# the base fleet or an earlier block -- see `opengrid.fleet.seed.ZoneBlockConfig`/
# `ogsim.common.config.ZoneBlockConfig` for the exact id/dual-unit rule. Homes-per-bank is 50 (same as
# the base fleet) so the same 0.2 dual_unit_share above yields 10 dual-unit homes per new bank too.
# `[forecast].price_series`/`load_series` (orchestrator.toml) and `[zone_default_tdsp]`
# (tdsp_tariffs.toml) must also be updated when a block is enabled -- see those files' own comments.
#
# LZ_LCRA (Lower Colorado River Authority) and LZ_RAYBN (Rayburn Country Electric Cooperative) are
# FREE-market ERCOT zones (unlike LZ_AEN/LZ_CPS above, which are REGULATED-utility zones) -- confirmed
# present in live ERCOT NP6-905-CD settlement-point-price results (2026-09-26 probe, FLEET-SIM build
# report: 8 LZ points returned, including these two).
#
# ENABLED (OWNER DECISION D-32, 2026-09-26): both free-market zones go live -- this adds 500 hubs/10
# banks each (bank-060..069 LZ_LCRA, bank-070..079 LZ_RAYBN) on top of the base fleet + AEN/CPS,
# 4,000 hubs / 80 banks total. LZ_AEN/LZ_CPS stay OFF here (`enabled: false`): production enables AEN
# via its own override (the release manager regenerates it separately), not this shipped default. See
# tdsp_tariffs.toml's `[zone_territory]` for LCRA/RAYBN's TDSP/delivery-charge treatment (LCRA is
# itself a transmission/distribution utility -- no separate competitive TDSP charge; RAYBN is a
# member-owned cooperative, outside retail competition -- no filed competitive TDSP tariff).
zone_blocks:
  - zone: LZ_AEN
    banks: 10
    homes_per_bank: 50
    enabled: false
  - zone: LZ_CPS
    banks: 10
    homes_per_bank: 50
    enabled: false
  - zone: LZ_LCRA
    banks: 10
    homes_per_bank: 50
    enabled: true
  - zone: LZ_RAYBN
    banks: 10
    homes_per_bank: 50
    enabled: true

# Substation-sited battery-set assets (build phase, 2026-09-26: 09-optimizer-dispatcher-update.md D11
# SUBSTATION_BESS; `ogsim.common.config.SubstationAssetConfig`). Configurable and OFF by default, same
# as the zone_blocks above -- a substation asset is its own one-hub "bank"
# (`ogsim.fleet.state._substation_segment`), not part of the home-fleet numbering, so enabling it adds
# one extra simulated hub on top of `hub_count`.
#
# ENABLED (OWNER DECISION D-29(b), 2026-09-26): the utility toll demo needs a live Austin substation
# asset. This adds exactly one extra simulated hub (`sub-LZ_AEN-00`, bank `bank-sub-LZ_AEN-00`) on top
# of the base `hub_count` -- fixed-hub-count tests/tools that assumed the shipped fleet.yaml's hub set
# was exactly `hub_count` (benchmark, wave, scada-roster parity, etc.) have been updated to derive the
# count from `len(engine.state.hub_ids)` instead of a hardcoded/`config.hub_count` assumption; see the
# FLEET-SIM build report for the exact list. `asset_id`/bank id are coordinated with the MARKET-MODEL
# agent's `og.asset` model (same report has the seed/DB wiring live-path needs).
substation_assets:
  - asset_id: sub-LZ_AEN-00
    zone: LZ_AEN
    rated_mw: 20.0
    duration_h: 2.0
    enabled: true

# Mobile-unit (trailer) registry (#33 target-check, D-31, 2026-09-26). A target-existence registry
# only -- ogsim.fleet does not simulate a mobile unit's physics as a FleetState hub yet (D-31: never
# charged from the fleet; see `ogsim.common.config.MobileUnitConfig`'s docstring). Mirrors SERVICES'
# orchestrator/config/service_profiles/mobile_storage_home_stations.toml `[[assignment]]` 1:1 -- same
# trailer_id/home_station_id ids (that file also lists hs-austin-north-01's own zone/lat/lon/
# charger_kw, kept there since a home station is a charging depot, not a fleet hub/bank).
#
# Truck fleet (owner request 2026-09-26): `simulate: true` entries are ALSO simulated as their own
# one-hub bank (hub = trailer_id, bank = bank_id), publishing telemetry and device_info (asset_class
# MOBILE_STORAGE) at lat/lon = their current position, parked at the home station (at_home: true, so
# charging is allowed; D-31: never charged away from home). Must match mobile_storage_home_stations.toml
# (bank_id/hub_id/home_station_id, station lat/lon/zone) and dev/seed/mobile_trucks_seed.sql 1:1.
mobile_units:
  - trailer_id: trailer-mb-01
    home_station_id: hs-austin-north-01
  - {trailer_id: truck-aus-01, bank_id: bank-truck-aus-01, home_station_id: hs-aus-roundrock-01, simulate: true, zone: LZ_SOUTH, lat: 30.5195, lon: -97.6480, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-aus-02, bank_id: bank-truck-aus-02, home_station_id: hs-aus-sandhill-01, simulate: true, zone: LZ_AEN, lat: 30.2090, lon: -97.6125, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-sat-01, bank_id: bank-truck-sat-01, home_station_id: hs-sat-selma-01, simulate: true, zone: LZ_CPS, lat: 29.5840, lon: -98.3170, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-sat-02, bank_id: bank-truck-sat-02, home_station_id: hs-sat-leoncreek-01, simulate: true, zone: LZ_CPS, lat: 29.3570, lon: -98.5680, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-dfw-01, bank_id: bank-truck-dfw-01, home_station_id: hs-dfw-irving-01, simulate: true, zone: LZ_NORTH, lat: 32.8385, lon: -96.9730, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-dfw-02, bank_id: bank-truck-dfw-02, home_station_id: hs-dfw-garland-01, simulate: true, zone: LZ_NORTH, lat: 32.8920, lon: -96.6560, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-dfw-03, bank_id: bank-truck-dfw-03, home_station_id: hs-dfw-mesquite-01, simulate: true, zone: LZ_NORTH, lat: 32.7905, lon: -96.6150, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}
  - {trailer_id: truck-dfw-04, bank_id: bank-truck-dfw-04, home_station_id: hs-dfw-grandprairie-01, simulate: true, zone: LZ_NORTH, lat: 32.7630, lon: -97.0560, p_kw: 500.0, e_kwh: 1000.0, reserve_frac: 0.20, at_home: true}

guardian_public_key_path: /etc/opengrid/guardian_ed25519.pub
# Local/dev override (hex or base64 32-byte Ed25519 public key), takes
# precedence over guardian_public_key_path when non-empty:
guardian_public_key_path_dev: ""

# Per-inverter power-quality imperfection model (06-service-profiles-and-power-quality.md
# §3.1/§7.1/§7.3). One unit per hub; dual-unit homes (above) get two independently-seeded units.
inverter_pq:
  freq_offset_std_hz: 0.01
  voltage_offset_std_pct: 0.5
  thd_current_median_pct: 2.0
  thd_current_p95_pct: 4.5
  harmonic_phase_lock: false   # false = diverse (cancellation regime), true = locked (stacking regime)
  ride_through_class_default: CATEGORY_III
  calibration_rate_limit_s: 86400.0  # at most one remote-calibration attempt per unit per 24h

# Waveform summary/raw generation and publication (06-service-profiles-and-power-quality.md
# §6.4/§7.4, WP-H). The harmonic-detail sub-block publishes every harmonic_detail_interval_s
# OR sooner if aggregate THD_I moves by more than harmonic_detail_delta_pct (§6.4b bandwidth
# mitigation). Raw captures are triggered-only; raw_audit_sample_pct_per_min bounds this sim's
# own rotating self-audit sample (§6.4b trigger policy item iii) to that % of the fleet/minute.
#
# summary_interval_s/summary_delta_pct (S9 wave-2 fix): gates the summary MESSAGE ITSELF, not
# just its harmonic-detail sub-block -- the old behaviour published a full summary every
# telemetry_interval_s (2.0s default) regardless, which is the ~1,000 msg/s at 2,000 hubs that
# stalled opengrid.pq_ingest's one-insert-per-message path. OWNER DECISION, 2026-09-26 (V-32): now
# 30s (was 10s), matching the same telemetry-cadence-driven disk-load reduction as
# telemetry_interval_s above -- still within §5.4's monitoring-cadence requirement. At 2,000 hubs
# this is now ~65 msg/s; at 10,000 hubs, ~330 msg/s (see the wave-2 build report for the full
# bandwidth math at the old 10s cadence).
wave:
  harmonic_detail_interval_s: 30.0
  harmonic_detail_delta_pct: 1.0
  raw_audit_sample_pct_per_min: 1.0
  sync_source: ptp
  sync_quality_ns: 50.0
  summary_interval_s: 30.0
  summary_delta_pct: 1.0

# Firmware updates (OWNER DECISION, 2026-09-26, R3.1: ships in the final release). Merged onto
# `ogsim.fleet.firmware.FirmwareSimConfig`'s own defaults by `ogsim.common.config._firmware_from_raw`
# (FleetEngine passes this whole block straight through as `FirmwareSimConfig(**config.firmware)`).
# duration_min_s/duration_max_s: an accepted update's simulated DOWNLOADING->INSTALLING->REBOOTING->
# DONE timeline is drawn uniformly from this range. failure_rate: 0.0 here (no simulated failures in
# the shipped default); the demo can set this to 0.1 in its own config override to show a FAILED/
# rollback path. images: {} means the hub trusts the command's sha256 with no catalogue to check it
# against (no HASH_MISMATCH/DOWNLOAD_ERROR possible) -- set per-version sha256 entries here once a real
# firmware image catalogue exists.
firmware:
  duration_min_s: 30.0
  duration_max_s: 90.0
  failure_rate: 0.0
  images: {}
