name: demo-02-bank-overload
description: >
  DEMO step 11-12 (docs/demo/README.md): SCADA reports bank-012 (LZ_NORTH,
  600 kVA feeder-segment rating) at 25% over its rating, i.e. 750 kVA (125%),
  whatever the bank's actual load. 125% is above the health rule's critical
  threshold (120%), so ALR-SCADA-OVERLOAD:bank-012 opens as critical. If a
  DIST_DEFERRAL obligation is on the bank, its PI loop adds relief discharge
  (reason R-GRANT-DIST-DEFERRAL-PI) without touching any committed quantity.
  After 3 overloaded readings the SCADA sim also issues a LIMIT at 90% of the
  rating, lifted 3 readings after the overload ends. Runs 300 s and clears on
  its own. To end early:
  DELETE /api/anomalies/demo-02-bank-overload:bank_overload:0.
steps:
  - at_s: 0
    type: bank_overload
    target: bank-012
    params: {kva_over_rating_pct: 25}
    duration: 300
