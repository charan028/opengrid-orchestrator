name: utility_aen_cancel_mid_call
description: >
  An Austin Energy toll call cancelled after 60 s. Expected: ACCEPTED, then COMPLETED; the obligation returns to its 0 kW hold next cycle.
  Runs in ogsim.utility_aen (unit og-sim-utility) against the orchestrator; the result (PASS/FAIL
  against the expectation) is logged as utility_scenario_result.
steps:
  - at_s: 0
    type: utility_call_cancel_mid
    target: AUSTIN_ENERGY
    params: {kw: 5000, duration_min: 15, cancel_after_s: 60}
    duration: 1
