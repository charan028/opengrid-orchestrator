name: zone_comms_loss
description: >
  All hubs in one weather zone stop reporting telemetry. Proves health marks
  those hubs stale -> offline, the engine excludes them from capability, and
  hubs fall to local autonomy on lease expiry.
steps:
  - at_s: 0
    type: zone_mass_disconnect
    target: LZ_SOUTH
    params: {}
    duration: 180
