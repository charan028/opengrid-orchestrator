name: ercot_as_06_unknown_award
description: >
  Instruction for an unknown award: a resource with no mapped award. Expected: refused as 404,
  acknowledged REJECT, ALR-ERCOT-AS-REFUSED raised, nothing deployed.
  Publishes ERCOT AS dispatch instructions on ogsim.market's MMS/EWS endpoint (/mms/ews/, D-35). The
  orchestrator sees them only when [feeds.ercot_as_poll] is enabled and points at this simulator; its
  decision and acknowledgement are listed at GET /mms/admin/vdis on the market sim.
steps:
  - at_s: 0
    type: ercot_as_unknown_award
    target: OG_ESR_UNKNOWN
    params: {service: ECRS, mw: 0.5}
    duration: 60