name: tampered_command
description: >
  A command with an invalid/missing Ed25519 signature is injected at a hub.
  Proves the hub (and, by construction, any real hub) rejects it outright
  and never partially applies it.
steps:
  - at_s: 0
    type: tampered_unsigned_command
    target: HUB_0142
    params: {}
    duration: 30
