name: ercot_as_04_duplicate
description: >
  Duplicate instruction: an ECRS deployment delivered again after it was acknowledged. Expected: one
  deployment only; the duplicate is recognised by its instruction id and acknowledged again, no alert.
  Publishes ERCOT AS dispatch instructions on ogsim.market's MMS/EWS endpoint (/mms/ews/, D-35). The
  orchestrator sees them only when [feeds.ercot_as_poll] is enabled and points at this simulator; its
  decision and acknowledgement are listed at GET /mms/admin/vdis on the market sim.
steps:
  - at_s: 0
    type: ercot_as_duplicate
    target: OG_ESR_1
    params: {service: ECRS}
    duration: 600