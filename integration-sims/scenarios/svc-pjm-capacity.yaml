name: svc_pjm_capacity
description: >
  A simulated PJM Reliability Pricing Model (RPM) capacity-performance emergency event for a
  PJM_CAPACITY contract (config/service_profiles/pjm_capacity.toml, owner decision 2026-09-26).
  PJM stays fully simulated -- there is no real PJM membership or eRPM/eDART feed; this scenario is
  the ONLY source of a "declared emergency performance hour" in this environment. Proves: the fleet
  ramps committed kW to the site meter within the profile's 10-minute Capacity Performance deadline
  (response_time_s = 600.0), holds for the declared hour, and a shortfall during that window prices
  the non-performance charge (opengrid.settle.services_extra.pjm_non_performance_charge) on top of
  the ordinary CAPACITY_PAYMENT line -- never doubled outside the declared window.

  Step type "pjm_emergency_performance_event" IS now in ogsim's anomaly catalogue
  (integration-sims/src/ogsim/control/catalogue.py, owner: market) but has no handler yet in
  `ogsim.market.anomalies.MARKET_ANOMALY_TYPES` -- injecting it is a no-op until that wiring lands;
  see the SERVICES agent's 2026-09-26 report for the FLEET-SIM/market wiring line still needed.
  `ogsim.control.scenarios.load_scenario` parses this file today regardless (schema validation is
  structural only: at_s/type/target).

  Target fix (#33 target-check, 2026-09-26): "pjm-zone-aep-01" is a market-owned target (catalogue.py's
  `pjm_emergency_performance_event` entry, owner: market) -- it belongs in a market zone/product
  registry, not a customer id. PJM has no real feed (fully simulated, per this file's own header), so
  it's now a registered simulated zone id, `ogsim.market.data.SIMULATED_PJM_ZONES`, rather than an ERCOT
  `PRODUCTS` entry (those are real NP report codes the market simulator actually serves over HTTP).
steps:
  - at_s: 0
    type: pjm_emergency_performance_event
    target: pjm-zone-aep-01
    params: {committed_kw: 5000.0, declared_by: "SIMULATED_ISO_INSTRUCTION"}
    duration: 3600
  - at_s: 1800
    type: hub_offline
    target: hub-00701
    params: {}
    duration: 300
  - at_s: 3600
    type: pjm_emergency_performance_event
    target: pjm-zone-aep-01
    params: {committed_kw: 0.0, declared_by: "SIMULATED_ISO_INSTRUCTION", recall: true}
    duration: 0
