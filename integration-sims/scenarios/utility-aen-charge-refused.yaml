name: utility_aen_charge_refused
description: >
  Austin Energy sends a CHARGE instruction (+5 MW) on the toll. Expected: REFUSED R-CALL-CHARGE-REFUSED (discharge calls only, D-29c).
  Runs in ogsim.utility_aen (unit og-sim-utility) against the orchestrator; the result (PASS/FAIL
  against the expectation) is logged as utility_scenario_result.
steps:
  - at_s: 0
    type: utility_call_charge
    target: AUSTIN_ENERGY
    params: {kw: 5000}
    duration: 1
