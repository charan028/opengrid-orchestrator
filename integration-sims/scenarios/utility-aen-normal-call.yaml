name: utility_aen_normal_call
description: >
  A normal Austin Energy toll call (5 MW for 15 min) through the utility customer API. Expected: ACCEPTED; the Dispatch screen shows it with origin UTILITY and an ALR-UTILITY-CALL alert opens.
  Runs in ogsim.utility_aen (unit og-sim-utility) against the orchestrator; the result (PASS/FAIL
  against the expectation) is logged as utility_scenario_result.
steps:
  - at_s: 0
    type: utility_call_normal
    target: AUSTIN_ENERGY
    params: {kw: 5000, duration_min: 15}
    duration: 1
