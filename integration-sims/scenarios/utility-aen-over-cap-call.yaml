name: utility_aen_over_cap_call
description: >
  A 91-minute Austin Energy toll call. Expected: REFUSED R-CALL-DURATION-CAP (the TOLLING product is 90 min) and an ALR-UTILITY-CALL-REFUSED alert.
  Runs in ogsim.utility_aen (unit og-sim-utility) against the orchestrator; the result (PASS/FAIL
  against the expectation) is logged as utility_scenario_result.
steps:
  - at_s: 0
    type: utility_call_over_cap
    target: AUSTIN_ENERGY
    params: {kw: 5000}
    duration: 1
