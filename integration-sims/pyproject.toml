[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogsim"
version = "0.1.0"
description = "OpenGrid integration simulators (market/EIA/NWS, fleet, SCADA) and their control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "httpx>=0.27",
    "aiomqtt>=2",
    "cryptography>=42",
    "pyyaml>=6",
    "jsonschema>=4",
    "numpy>=1.26",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ogsim"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends()/Query() default-arg pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# These FastAPI query-param names must match ERCOT's/EIA's real camelCase API
# parameters verbatim (spec fidelity), not Python naming convention.
"src/ogsim/market/routes_ercot.py" = ["N803"]
"src/ogsim/market/routes_eia.py" = ["N803"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
